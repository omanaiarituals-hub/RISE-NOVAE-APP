<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
      <defs>
        <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#071D38"/>
          <stop offset="1" stop-color="#020D1D"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#071D38" flood-opacity=".18"/>
        </filter>
        <style>
          .logo { font: 500 26px Georgia, serif; letter-spacing: .12em; fill: #D1A458; }
          .date { font: 700 10px Arial, sans-serif; letter-spacing: .14em; fill: #D1A458; }
          .hello { font: 500 34px Georgia, serif; fill: #0E2744; }
          .hero-title { font: 500 28px Georgia, serif; fill: #fffaf3; }
          .hero-small { font: 500 11px Arial, sans-serif; fill: rgba(255,255,255,.72); }
          .action { font: 700 10px Arial, sans-serif; fill: #fffaf3; }
          .eyebrow { font: 800 10px Arial, sans-serif; letter-spacing: .12em; fill: #D1A458; }
          .card-title { font: 600 13px Georgia, serif; fill: #0E2744; }
          .metric { font: 500 32px Georgia, serif; fill: #0E2744; text-anchor: middle; }
          .small { font: 700 8px Arial, sans-serif; letter-spacing: .09em; fill: #657184; text-anchor: middle; }
          .module { font: 600 11px Georgia, serif; fill: #0E2744; text-anchor: middle; }
        </style>
      </defs>

      <rect width="760" height="470" rx="28" fill="#FBF9F5"/>
      
        <circle cx="680" cy="120" r="2" fill="#D1A458" opacity=".7"/>
        <circle cx="630" cy="100" r="1.6" fill="#D1A458" opacity=".55"/>
        <circle cx="710" cy="155" r="1.3" fill="#D1A458" opacity=".5"/>
        
      <rect x="0" y="0" width="760" height="56" fill="#FFFDF9" opacity=".92"/>
      <line x1="0" y1="56" x2="760" y2="56" stroke="#DED9D1"/>
      <text x="34" y="36" class="logo">NOVAÉ</text>
      <circle cx="710" cy="28" r="14" fill="#020D1D" stroke="#D1A458"/>

      <text x="36" y="79" class="date">MERCREDI 29 JUILLET</text>
      <text x="36" y="110" class="hello">Bonsoir, Ness</text>

      <rect x="36" y="128" width="688" height="138" rx="22" fill="url(#hero)" stroke="#D1A458" filter="url(#shadow)"/>
      <text x="62" y="165" class="hero-title">Qu’est-ce que je peux faire</text>
      <text x="62" y="194" class="hero-title">pour toi aujourd’hui ?</text>
      <text x="62" y="216" class="hero-small">Nova t’aide à gagner du temps et à passer à l’essentiel.</text>
      <text x="590" y="188" class="logo">NO</text>
      <g transform="translate(58 232)">
        <rect width="180" height="24" rx="8" fill="rgba(0,0,0,.12)" stroke="#D1A458" opacity=".85"/>
        <rect x="202" width="180" height="24" rx="8" fill="rgba(0,0,0,.12)" stroke="#D1A458" opacity=".85"/>
        <rect x="404" width="180" height="24" rx="8" fill="rgba(0,0,0,.12)" stroke="#D1A458" opacity=".85"/>
        <text x="90" y="16" class="action" text-anchor="middle">Écrire</text>
        <text x="292" y="16" class="action" text-anchor="middle">Parler</text>
        <text x="494" y="16" class="action" text-anchor="middle">Importer</text>
      </g>

      
        <rect x="36" y="286" width="326" height="112" rx="18" fill="#FFFDF9" stroke="#DED9D1"/>
        <rect x="378" y="286" width="346" height="112" rx="18" fill="#FFFDF9" stroke="#DED9D1"/>
        <text x="58" y="311" class="eyebrow">AUJOURD'HUI</text>
        <line x1="58" y1="330" x2="330" y2="330" stroke="#DED9D1"/>
        <circle cx="64" cy="352" r="5" fill="#D1A458"/>
        <line x1="78" y1="352" x2="202" y2="352" stroke="#657184" stroke-width="4" stroke-linecap="round"/>
        <circle cx="64" cy="374" r="5" fill="#D1A458"/>
        <line x1="78" y1="374" x2="232" y2="374" stroke="#657184" stroke-width="4" stroke-linecap="round"/>
        <text x="400" y="311" class="eyebrow">PRIORITÉS</text>
        <line x1="400" y1="330" x2="692" y2="330" stroke="#DED9D1"/>
        <line x1="400" y1="352" x2="610" y2="352" stroke="#657184" stroke-width="4" stroke-linecap="round"/>
        <line x1="400" y1="374" x2="650" y2="374" stroke="#657184" stroke-width="4" stroke-linecap="round"/>
        

      <text x="36" y="430" class="eyebrow">MES MODULES</text>
      <g transform="translate(360 418)">
        <rect x="-130" y="0" width="54" height="40" rx="10" fill="#020D1D" stroke="#D1A458"/>
        <rect x="-27" y="0" width="54" height="40" rx="10" fill="#020D1D" stroke="#D1A458"/>
        <rect x="76" y="0" width="54" height="40" rx="10" fill="#020D1D" stroke="#D1A458"/>
        <text x="-103" y="58" class="module">Documents</text>
        <text x="0" y="58" class="module">Planner</text>
        <text x="103" y="58" class="module">Repas</text>
      </g>
    </svg>