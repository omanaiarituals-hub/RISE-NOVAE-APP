<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
      <defs>
        <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#173D32"/>
          <stop offset="1" stop-color="#0D2B25"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#173D32" flood-opacity=".18"/>
        </filter>
        <style>
          .logo { font: 500 26px Georgia, serif; letter-spacing: .12em; fill: #C69A5B; }
          .date { font: 700 10px Arial, sans-serif; letter-spacing: .14em; fill: #C69A5B; }
          .hello { font: 500 34px Georgia, serif; fill: #1C2924; }
          .hero-title { font: 500 28px Georgia, serif; fill: #fffaf3; }
          .hero-small { font: 500 11px Arial, sans-serif; fill: rgba(255,255,255,.72); }
          .action { font: 700 10px Arial, sans-serif; fill: #fffaf3; }
          .eyebrow { font: 800 10px Arial, sans-serif; letter-spacing: .12em; fill: #C69A5B; }
          .card-title { font: 600 13px Georgia, serif; fill: #1C2924; }
          .metric { font: 500 32px Georgia, serif; fill: #1C2924; text-anchor: middle; }
          .small { font: 700 8px Arial, sans-serif; letter-spacing: .09em; fill: #6D6A61; text-anchor: middle; }
          .module { font: 600 11px Georgia, serif; fill: #1C2924; text-anchor: middle; }
        </style>
      </defs>

      <rect width="760" height="470" rx="28" fill="#FBF8F2"/>
      
        <ellipse cx="90" cy="120" rx="110" ry="28" fill="#0D2B25" opacity=".28" transform="rotate(-13 90 120)"/>
        <ellipse cx="142" cy="150" rx="72" ry="18" fill="#0D2B25" opacity=".18" transform="rotate(19 142 150)"/>
        
      <rect x="0" y="0" width="760" height="56" fill="#FFFDF9" opacity=".92"/>
      <line x1="0" y1="56" x2="760" y2="56" stroke="#E4D8C9"/>
      <text x="34" y="36" class="logo">NOVAÉ</text>
      <circle cx="710" cy="28" r="14" fill="#0D2B25" stroke="#C69A5B"/>

      <text x="36" y="79" class="date">MERCREDI 29 JUILLET</text>
      <text x="36" y="110" class="hello">Bonsoir, Ness</text>

      <rect x="36" y="128" width="688" height="138" rx="22" fill="url(#hero)" stroke="#C69A5B" filter="url(#shadow)"/>
      <text x="62" y="165" class="hero-title">Qu’est-ce que je peux faire</text>
      <text x="62" y="194" class="hero-title">pour toi aujourd’hui ?</text>
      <text x="62" y="216" class="hero-small">Nova t’aide à gagner du temps et à passer à l’essentiel.</text>
      <text x="590" y="188" class="logo">NO</text>
      <g transform="translate(58 232)">
        <rect width="180" height="24" rx="8" fill="rgba(0,0,0,.12)" stroke="#C69A5B" opacity=".85"/>
        <rect x="202" width="180" height="24" rx="8" fill="rgba(0,0,0,.12)" stroke="#C69A5B" opacity=".85"/>
        <rect x="404" width="180" height="24" rx="8" fill="rgba(0,0,0,.12)" stroke="#C69A5B" opacity=".85"/>
        <text x="90" y="16" class="action" text-anchor="middle">Écrire</text>
        <text x="292" y="16" class="action" text-anchor="middle">Parler</text>
        <text x="494" y="16" class="action" text-anchor="middle">Importer</text>
      </g>

      
        <rect x="36" y="286" width="430" height="112" rx="18" fill="#FFFDF9" stroke="#E4D8C9"/>
        <rect x="482" y="286" width="242" height="112" rx="18" fill="#FFFDF9" stroke="#E4D8C9"/>
        <circle cx="74" cy="322" r="18" fill="#0D2B25" stroke="#C69A5B"/>
        <circle cx="518" cy="322" r="18" fill="#0D2B25" stroke="#C69A5B"/>
        <text x="106" y="319" class="card-title">Les 3 prochaines heures</text>
        <text x="550" y="319" class="card-title">Priorité</text>
        <line x1="106" y1="342" x2="420" y2="342" stroke="#E4D8C9"/>
        <line x1="106" y1="364" x2="310" y2="364" stroke="#6D6A61" stroke-width="5" stroke-linecap="round"/>
        <line x1="550" y1="353" x2="680" y2="353" stroke="#6D6A61" stroke-width="5" stroke-linecap="round"/>
        

      <text x="36" y="430" class="eyebrow">MES MODULES</text>
      <g transform="translate(360 418)">
        <rect x="-130" y="0" width="54" height="40" rx="10" fill="#0D2B25" stroke="#C69A5B"/>
        <rect x="-27" y="0" width="54" height="40" rx="10" fill="#0D2B25" stroke="#C69A5B"/>
        <rect x="76" y="0" width="54" height="40" rx="10" fill="#0D2B25" stroke="#C69A5B"/>
        <text x="-103" y="58" class="module">Documents</text>
        <text x="0" y="58" class="module">Planner</text>
        <text x="103" y="58" class="module">Repas</text>
      </g>
    </svg>